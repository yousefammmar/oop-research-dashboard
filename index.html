<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOP Research</title>
<!-- Reads the files "Export data.command" writes into exports/ (plain on this Mac, encrypted on the website).
     Nothing is sent anywhere. make-dashboard-data.cjs copies this file to site/index.html. -->
<script src="exports/index.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --side: #111827; --side-text: #cbd5e1; --side-active: #1f2937;
    --text: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #4f46e5; --accent-soft: #eef2ff;
    --ok: #15803d; --bad: #b91c1c; --flag: #fff7e6; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --card: #171a21; --side: #0b0d12; --side-text: #9aa3b2; --side-active: #1c2130; --text: #e5e7eb; --muted: #9aa3b2;
      --line: #262b36; --accent: #818cf8; --accent-soft: #1e2140; --ok: #4ade80; --bad: #f87171; --flag: #3a3016; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body { margin: 0; font: 14px/1.6 "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
  .brand { color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; padding: 0 8px; }
  .brand small { display: block; color: var(--side-text); font-weight: 400; font-size: 12px; margin-top: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding: 9px 10px; border-radius: 8px; font-size: 14px; }
  nav a:hover, nav a.active { background: var(--side-active); color: #fff; }
  nav a .ic { width: 18px; text-align: center; opacity: .8; font-size: 13px; }
  .side-foot { margin-top: auto; font-size: 12px; padding: 0 8px; line-height: 1.7; }
  .content { min-width: 0; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header.top h1 { font-size: 17px; margin: 0; margin-inline-end: auto; }
  .ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  main { padding: 24px 28px 60px; max-width: 1500px; }
  section { margin-bottom: 36px; }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card .k { color: var(--muted); font-size: 12px; }
  .card b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .card .s { color: var(--muted); font-size: 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .panel h3 { font-size: 14px; margin: 0 0 8px; }
  .summary { line-height: 1.9; margin: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .chart svg { width: 100%; height: auto; direction: ltr; display: block; }
  .chart text { font: 11px "IBM Plex Sans Arabic", system-ui, sans-serif; fill: var(--text); }
  .chart .axis { stroke: var(--line); }
  .chart .grid { stroke: var(--line); stroke-dasharray: 3 3; }
  .chart .track { fill: var(--accent-soft); }
  .chart .bar { fill: var(--accent); }
  .chart .dot { fill: var(--accent); opacity: .85; }
  .chart .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  input, select, button { font: inherit; }
  input, select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  input[type="search"] { margin-inline-start: auto; min-width: 200px; }
  .wrap { overflow: auto; max-height: 70vh; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  table { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: start; }
  th { position: sticky; top: 0; background: var(--card); font-weight: 600; color: var(--muted); font-size: 12px; user-select: none; }
  th.sortable { cursor: pointer; }
  th[title] { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  td.num { text-align: end; font-variant-numeric: tabular-nums; }
  td.missing { color: var(--muted); }
  td.yes { color: var(--ok); } td.no { color: var(--bad); }
  tr.flag td { background: var(--flag); }
  .muted { color: var(--muted); font-size: 13px; }
  .note { margin: 8px 0 0; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--flag); border: 1px solid var(--line); vertical-align: -1px; }
  .explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .explain .panel p { margin: 4px 0; }
  .explain .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-inline-start: 6px; }
  .notes p { margin: 6px 0; } .notes h4 { margin: 12px 0 4px; font-size: 14px; } .notes ul { margin: 4px 0; padding-inline-start: 20px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 12px; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  form.lock { max-width: 360px; margin: 80px auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; box-shadow: var(--shadow); }
  form.lock input[type="password"] { font-family: ui-monospace, monospace; direction: ltr; }
  button.btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin: 0; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 2px; } nav a { padding: 6px 8px; font-size: 13px; } .side-foot { display: none; }
    header.top, main { padding-inline: 16px; }
    input[type="search"] { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">OOP Research<small>GA4 × نتائج التعلّم</small></div>
    <nav id="nav">
      <a href="#overview"><span class="ic">◧</span>نظرة عامة</a>
      <a href="#topics"><span class="ic">▤</span>حسب الموضوع</a>
      <a href="#students"><span class="ic">◉</span>الطلاب</a>
      <a href="#sessions"><span class="ic">◷</span>الجلسات</a>
      <a href="#attempts"><span class="ic">✎</span>محاولات الكويز</a>
      <a href="#explain"><span class="ic">?</span>شو معنى الأرقام</a>
      <a href="#notes"><span class="ic">✉</span>ملاحظات يوسف</a>
    </nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="content">
    <header class="top">
      <h1>لوحة بيانات الدراسة</h1>
      <label class="ctl">التصدير <select id="day"></select></label>
      <label class="ctl">الفترة <select id="period">
        <option value="all">كل الفترة</option><option value="7">آخر 7 أيام</option><option value="30">آخر 30 يوم</option><option value="custom">تاريخ محدد</option>
      </select></label>
      <span class="ctl" id="range" hidden>من <input type="date" id="from"> إلى <input type="date" id="to"></span>
    </header>
    <main id="main"></main>
  </div>
</div>

<script>
'use strict';

/* ───── Readable names ───── */
const TOPICS = { cpp: 'C++ Revision', classes: 'Class Basics', const: 'Const & Static', composition: 'Composition', dma: 'Dynamic Memory',
  this: 'this Pointer', friend: 'Friend Functions', inheritance: 'Inheritance', polymorphism: 'Polymorphism', operators: 'Operator Overloading' };
const QUIZ_STATUS = { not_started: 'ما بدأ', started: 'بدأ وما سلّم', completed: 'سلّم' };
const END_SOURCE = { recorded: 'مسجّل', inferred: 'مستنتج', open: 'لسا مفتوحة' };

/* Columns: [column, label, kind, hint, core]. kind: id | min (seconds → m:ss) | pct | score | yesno | date | topic | status | end | n | text */
const COLS = {
  students: [
    ['research_id', 'الطالب', 'id', 'كود الطالب (مجهول). نفس الكود موجود بالـ GA4 باسم participant_id', true],
    ['quiz_first_score_mean', 'علامة الكويز', 'score', 'المتغير التابع: متوسط علامة أول محاولة بكل موضوع، من 100. فاضي = ما عمل ولا كويز', true],
    ['quizzes_first_attempt', 'كويزات', 'n', 'كم موضوع عمل فيه كويز لأول مرة', true],
    ['sessions', 'جلسات', 'n', 'جلسات دراسة على صفحات المواضيع (Firebase)'],
    ['topics_studied', 'مواضيع', 'n', 'كم موضوع فتح', true],
    ['engagement_time_seconds', 'وقت نشط', 'min', 'دقائق:ثواني. الوقت اللي كان فيه بيتحرك أو بيكتب، وبيوقف بعد 60 ثانية بدون حركة (Firebase)', true],
    ['page_views', 'صفحات', 'n', 'عدد مرات فتح صفحات المواضيع (Firebase)'],
    ['max_scroll_depth_mean', 'نزول بالصفحة', 'pct', 'متوسط أبعد نقطة وصلها بالصفحة (%)'],
    ['topics_completed', 'علّم مكتمل', 'n', 'مواضيع ضغط فيها "Mark as completed"'],
    ['quiz_attempts', 'كل المحاولات', 'n', 'كل محاولات الكويز مع الإعادات'],
    ['ga4_linked', 'GA4', 'yesno', 'هل إله بيانات بالـ GA4؟ فاضي = التصدير ما قدر يقرأ GA4', true],
    ['ga4_engagement_seconds', 'GA4 وقت', 'min', 'engagement time من GA4، دقائق:ثواني', true],
    ['ga4_views', 'GA4 صفحات', 'n', 'page views من GA4، بكل صفحات الموقع', true],
    ['ga4_sessions', 'GA4 جلسات', 'n', 'sessions من GA4'],
    ['ga4_scroll_events', 'GA4 نزول', 'n', 'كم مرة وصل 90% من صفحة (GA4)'],
    ['ga4_lesson_completions', 'GA4 مكتمل', 'n', 'ضغطات "Mark as completed" بكل الموقع (GA4)'],
    ['ga4_lab_completions', 'GA4 labs', 'n', 'Labs علّمها مكتملة (GA4)'],
    ['ga4_code_file_views', 'GA4 كود', 'n', 'ملفات كود فتحها (GA4)'],
    ['ga4_resource_clicks', 'GA4 مصادر', 'n', 'مصادر تعلّم فتحها بكل الموقع (GA4)'],
    ['ga4_device', 'الجهاز', 'text', 'الجهاز الأكثر استخداماً حسب GA4', true]
  ],
  sessions: [
    ['research_id', 'الطالب', 'id', 'كود الطالب', true],
    ['topic_id', 'الموضوع', 'topic', 'صفحة الموضوع', true],
    ['session_started_at', 'بدأت', 'date', 'بتوقيت الأردن', true],
    ['engagement_time_seconds', 'وقت نشط', 'min', 'دقائق:ثواني', true],
    ['page_views', 'صفحات', 'n', 'مرات فتح الصفحة بهاي الجلسة'],
    ['max_scroll_depth', 'نزول بالصفحة', 'pct', 'أبعد نقطة وصلها (%)', true],
    ['quiz_status', 'الكويز', 'status', 'هل عمل كويز بهاي الجلسة؟', true],
    ['quiz_score', 'العلامة', 'score', 'علامة أول محاولة بهاي الجلسة، من 100', true],
    ['quiz_prior_attempts', 'محاولات سابقة', 'n', 'كم مرة عمل كويز هاد الموضوع قبل هاي الجلسة. 0 = هاي أول مرة'],
    ['quiz_score_verified', 'العلامة متحققة', 'yesno', 'السكربت أعاد حساب العلامة من الإجابات وطلعت نفسها'],
    ['topic_completed', 'علّم مكتمل', 'yesno', 'ضغط "Mark as completed"'],
    ['session_ended_at', 'انتهت', 'date', 'بتوقيت الأردن'],
    ['session_end_source', 'كيف انتهت', 'end', 'مسجّل = الموقع سكّرها؛ مستنتج = ما رجع 30 دقيقة']
  ],
  attempts: [
    ['research_id', 'الطالب', 'id', 'كود الطالب', true],
    ['topic_id', 'الموضوع', 'topic', 'صفحة الموضوع', true],
    ['attempt_number', 'المحاولة', 'n', 'رقم المحاولة جوا الجلسة', true],
    ['quiz_prior_attempts', 'محاولات سابقة', 'n', 'قبل هاي الجلسة. 0 = أول مرة'],
    ['score_reported', 'العلامة', 'score', 'من 100', true],
    ['correct_count', 'صح', 'n', 'إجابات صحيحة من 8', true],
    ['score_verified', 'متحققة', 'yesno', 'العلامة انعاد حسابها وطلعت نفسها'],
    ['submitted_at', 'سلّم', 'date', 'بتوقيت الأردن', true],
    ['duration_seconds', 'المدة', 'min', 'من فتح الكويز للتسليم', true]
  ]
};
const VIEWS = [['core', 'الأساسي'], ['all', 'كل التفاصيل'], ['raw', 'الأعمدة الأصلية']];
const state = { day: null, period: 'all', from: '', to: '', view: 'core', t: { students: {}, sessions: {}, attempts: {} } };
const $ = (id) => document.getElementById(id);

function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n[k] = v; else n.setAttribute(k, v); });
  (kids || []).forEach((k) => n.append(k));
  return n;
}
function svg(tag, attrs, kids) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'text') n.textContent = v; else n.setAttribute(k, v); });
  (kids || []).forEach((k) => n.append(k));
  return n;
}

/** RFC 4180 CSV → { head: [...], rows: [[...]] } */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift() || [];
  return { head, rows: rows.filter((r) => r.length > 1 || r[0] !== '') };
}

const isNum = (v) => /^-?\d+(\.\d+)?$/.test(v);
const fmtDate = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Amman', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const utc = (s) => new Date(s.replace(' ', 'T') + 'Z');
const localDate = (s) => fmtDate.format(utc(s)); // "1 Nov, 10:11"
const mmss = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null);
const r1 = (x) => Math.round(x * 10) / 10;

/** Cell for the readable views: [text, class, title] */
function show(v, kind) {
  if (v === '' || v === undefined) return ['—', 'missing', ''];
  switch (kind) {
    case 'id': return [v.slice(0, 6), '', v];
    case 'min': return [mmss(Number(v)), 'num', v + ' ثانية'];
    case 'pct': return [Math.round(Number(v)) + '%', 'num', v];
    case 'score': return [Math.round(Number(v)) + '', 'num', v + ' من 100'];
    case 'yesno': return v === '1' ? ['✓', 'yes', ''] : ['✗', 'no', ''];
    case 'date': return [localDate(v), '', v + ' UTC'];
    case 'topic': return [TOPICS[v] || v, '', v];
    case 'status': return [QUIZ_STATUS[v] || v, '', v];
    case 'end': return [END_SOURCE[v] || v, '', v];
    default: return [v, isNum(v) ? 'num' : '', ''];
  }
}

/* ───── Period filter (Jordan time, UTC+3) ───── */
function periodBounds() {
  const day = 864e5, now = Date.now();
  if (state.period === '7' || state.period === '30') return [now - Number(state.period) * day, Infinity];
  if (state.period === 'custom') return [state.from ? Date.parse(state.from + 'T00:00:00+03:00') : -Infinity, state.to ? Date.parse(state.to + 'T23:59:59+03:00') : Infinity];
  return null;
}
function inPeriod(bounds, s) { return !bounds || (s !== '' && utc(s) >= bounds[0] && utc(s) <= bounds[1]); }
const periodLabel = () => ({ all: 'كل الفترة', 7: 'آخر 7 أيام', 30: 'آخر 30 يوم' })[state.period] || ((state.from || '…') + ' → ' + (state.to || '…'));

/* ───── Per-student table, computed from the (filtered) sessions; GA4 columns joined from the export's participants file.
   GA4 is a total since the study began, so it is shown only for "كل الفترة". ───── */
function aggregate(S, P, filtered) {
  const c = (n) => S.head.indexOf(n);
  const by = {};
  S.rows.forEach((r) => {
    const id = r[c('research_id')];
    const p = by[id] = by[id] || { id, sessions: 0, topics: new Set(), done: new Set(), scroll: [], first: [], time: 0, views: 0, attempts: 0 };
    p.sessions++; p.topics.add(r[c('topic_id')]);
    if (r[c('topic_completed')] === '1') p.done.add(r[c('topic_id')]);
    if (r[c('max_scroll_depth')] !== '') p.scroll.push(Number(r[c('max_scroll_depth')]));
    if (r[c('quiz_status')] === 'completed' && r[c('quiz_prior_attempts')] === '0' && r[c('quiz_score_verified')] === '1') p.first.push(Number(r[c('quiz_score')]));
    p.time += Number(r[c('engagement_time_seconds')]) || 0; p.views += Number(r[c('page_views')]) || 0; p.attempts += Number(r[c('quiz_attempt_count')]) || 0;
  });
  const ga = {}, pid = P.head.indexOf('research_id');
  P.rows.forEach((r) => { ga[r[pid]] = r; });
  const gaCols = filtered ? [] : P.head.filter((h) => h.startsWith('ga4_'));
  const head = ['research_id', 'quiz_first_score_mean', 'quizzes_first_attempt', 'sessions', 'topics_studied', 'engagement_time_seconds', 'page_views',
    'max_scroll_depth_mean', 'topics_completed', 'quiz_attempts'].concat(gaCols);
  const rows = Object.values(by).sort((a, b) => a.id.localeCompare(b.id)).map((p) => {
    const g = ga[p.id];
    return [p.id, p.first.length ? String(r1(mean(p.first))) : '', String(p.first.length), String(p.sessions), String(p.topics.size), String(p.time),
      String(p.views), p.scroll.length ? String(r1(mean(p.scroll))) : '', String(p.done.size), String(p.attempts)]
      .concat(gaCols.map((h) => (g ? g[P.head.indexOf(h)] : '')));
  });
  return { head, rows };
}

/* ───── Encrypted exports (the website): AES-256-GCM, key from the passphrase with PBKDF2.
   The passphrase comes from the link (#…), from this browser's storage, or from the lock form. ───── */
const PASS_KEY = 'research-pass';
const savedPass = () => sessionStorage.getItem(PASS_KEY) || localStorage.getItem(PASS_KEY) || '';
const linkPass = () => decodeURIComponent(location.hash.slice(1)).replace(/^#/, '');
const isSectionHash = () => /^#?(overview|topics|students|sessions|attempts|explain|notes)$/.test(location.hash);

async function decrypt({ salt, iv, ct, iterations }, pass) {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(salt), iterations, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(iv) }, key, b(ct))));
}

function askPass(day, wrong) {
  const input = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'كلمة السر', required: '' });
  const remember = el('input', { type: 'checkbox' });
  const err = el('p', { class: 'err', text: wrong ? 'كلمة السر غلط. جرّب مرة ثانية.' : '' });
  const form = el('form', { class: 'lock' }, [
    el('b', { text: 'البيانات مقفولة' }),
    el('span', { class: 'muted', text: 'افتح الصفحة من الرابط الكامل اللي بعته يوسف، أو اكتب كلمة السر. التشفير بينفك جوا متصفحك بس.' }),
    input, err,
    el('label', { class: 'ctl' }, [remember, 'تذكّرني على هاد الجهاز']),
    el('button', { class: 'btn primary', type: 'submit', text: 'فتح' })
  ]);
  form.onsubmit = async (e) => {
    e.preventDefault();
    try {
      EXPORTS[day] = await decrypt(EXPORTS[day].enc, input.value);
      (remember.checked ? localStorage : sessionStorage).setItem(PASS_KEY, input.value);
      render();
    } catch (_) { askPass(day, true); }
  };
  $('main').replaceChildren(form);
  input.focus();
}

/* ───── Loading ───── */
function loadDay(day) {
  state.day = day;
  const go = async () => {
    const d = EXPORTS[day];
    if (d && d.enc) {
      if (linkPass() && !isSectionHash()) { // the full link carries the key: no typing, and it is kept for next time
        try { EXPORTS[day] = await decrypt(d.enc, linkPass()); localStorage.setItem(PASS_KEY, linkPass()); history.replaceState(null, '', location.pathname); return render(); } catch (_) { /* fall through */ }
      }
      if (!savedPass()) return askPass(day);
      try { EXPORTS[day] = await decrypt(d.enc, savedPass()); } catch (_) { return askPass(day, true); }
    }
    render();
  };
  if (window.EXPORTS && EXPORTS[day]) return go();
  const s = el('script', { src: 'exports/' + day + '/data.js' });
  s.onload = go;
  s.onerror = () => message('ما قدرت أقرأ تصدير ' + day + '. شغّل Export data.command مرة ثانية.');
  document.head.append(s);
}

function message(text) { $('main').replaceChildren(el('div', { class: 'empty', text })); }

/* ───── Overview pieces ───── */
function card(k, v, s) { return el('div', { class: 'card' }, [el('div', { class: 'k', text: k }), el('b', { text: String(v) }), el('div', { class: 's', text: s || '' })]); }

function summaryText(S, st) {
  const topics = new Set(S.rows.map((r) => r[S.head.indexOf('topic_id')])).size;
  const parts = [(st.filtered ? 'بهاي الفترة ' : '') + 'شارك ' + st.n + ' طالب، فتحوا ' + S.rows.length + ' جلسة دراسة على ' + topics + ' مواضيع.'];
  parts.push(st.withQuiz ? st.withQuiz + ' منهم عملوا كويز، ومتوسط علامة أول محاولة ' + Math.round(st.meanScore) + ' من 100.' : 'ولا واحد منهم عمل كويز لسا.');
  if (st.filtered) parts.push('أرقام GA4 إجمالية من بداية الدراسة، فبتظهر بس لما تختار "كل الفترة".');
  else parts.push(st.fetched ? st.withGa4 + ' منهم وصلت بياناتهم للـ GA4، والجاهزين للتحليل الأساسي (كويز + GA4 مع بعض): ' + st.both + ' طالب.' : 'الـ GA4 ما انقرأ بهاد التصدير.');
  return parts.join(' ');
}

function barChart(P) {
  const id = P.head.indexOf('research_id'), sc = P.head.indexOf('quiz_first_score_mean');
  const pts = P.rows.filter((r) => r[sc] !== '').map((r) => [r[id], Number(r[sc])]).sort((a, b) => b[1] - a[1]);
  if (!pts.length) return el('p', { class: 'hint', text: 'لسا ما في علامات كويز.' });
  const H = pts.length * 24 + 8;
  const kids = pts.map(([code, v], i) => {
    const y = i * 24 + 4;
    return [svg('text', { x: 62, y: y + 13, 'text-anchor': 'end', text: code.slice(0, 6) }),
      svg('rect', { class: 'track', x: 70, y, width: 300, height: 16, rx: 4 }),
      svg('rect', { class: 'bar', x: 70, y, width: v * 3, height: 16, rx: 4 }, [svg('title', { text: code + ': ' + v })]),
      svg('text', { x: 378, y: y + 13, text: Math.round(v) })];
  }).flat();
  return svg('svg', { viewBox: '0 0 400 ' + H, role: 'img' }, kids);
}

function scatter(P) {
  const id = P.head.indexOf('research_id'), sc = P.head.indexOf('quiz_first_score_mean'), t = P.head.indexOf('ga4_engagement_seconds');
  if (t === -1) return el('p', { class: 'hint', text: 'بتظهر بس مع "كل الفترة"، لأنه أرقام GA4 إجمالية.' });
  const pts = P.rows.filter((r) => r[sc] !== '' && r[t] !== '').map((r) => [r[id], Number(r[t]) / 60, Number(r[sc])]);
  if (pts.length < 3) return el('p', { class: 'hint', text: 'بدها على الأقل 3 طلاب عندهم كويز وبيانات GA4. هلأ في ' + pts.length + '.' });
  const W = 400, H = 260, L = 40, B = 230, R = 390, T = 10;
  const maxX = Math.max(5, Math.ceil(Math.max(...pts.map((p) => p[1])) / 5) * 5);
  const x = (m) => L + (m / maxX) * (R - L), y = (s) => B - (s / 100) * (B - T);
  const kids = [];
  [25, 50, 75, 100].forEach((s) => kids.push(svg('line', { class: 'grid', x1: L, y1: y(s), x2: R, y2: y(s) })));
  kids.push(svg('line', { class: 'axis', x1: L, y1: B, x2: R, y2: B }), svg('line', { class: 'axis', x1: L, y1: T, x2: L, y2: B }));
  [0, 50, 100].forEach((s) => kids.push(svg('text', { x: L - 6, y: y(s) + 4, 'text-anchor': 'end', text: s })));
  [0, maxX / 2, maxX].forEach((m) => kids.push(svg('text', { x: x(m), y: B + 14, 'text-anchor': 'middle', text: m })));
  kids.push(svg('text', { x: (L + R) / 2, y: H - 2, 'text-anchor': 'middle', text: 'دقائق engagement بالـ GA4' }));
  kids.push(svg('text', { x: 12, y: (T + B) / 2, 'text-anchor': 'middle', transform: 'rotate(-90 12 ' + (T + B) / 2 + ')', text: 'علامة الكويز' }));
  pts.forEach(([code, m, s]) => kids.push(svg('circle', { class: 'dot', cx: x(m), cy: y(s), r: 5 }, [svg('title', { text: code + ': ' + mmss(m * 60) + ' دقيقة، علامة ' + Math.round(s) })])));
  return svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' }, kids);
}

function topicTable(S) {
  const c = (n) => S.head.indexOf(n);
  const by = {};
  S.rows.forEach((r) => {
    const t = by[r[c('topic_id')]] = by[r[c('topic_id')]] || { students: new Set(), sessions: 0, scores: [], time: [] };
    t.students.add(r[c('research_id')]); t.sessions++;
    if (r[c('engagement_time_seconds')] !== '') t.time.push(Number(r[c('engagement_time_seconds')]));
    if (r[c('quiz_status')] === 'completed' && r[c('quiz_prior_attempts')] === '0' && r[c('quiz_score_verified')] === '1') t.scores.push(Number(r[c('quiz_score')]));
  });
  const order = Object.keys(TOPICS).filter((k) => by[k]).concat(Object.keys(by).filter((k) => !TOPICS[k]));
  if (!order.length) return el('p', { class: 'muted', text: 'ما في جلسات بهاي الفترة.' });
  const cell = (v, cls) => el('td', { text: v === null ? '—' : String(v), class: v === null ? 'missing' : cls || '' });
  return el('div', { class: 'wrap' }, [el('table', {}, [
    el('thead', {}, [el('tr', {}, ['الموضوع', 'طلاب', 'جلسات', 'عملوا كويز', 'متوسط العلامة', 'متوسط الوقت النشط'].map((h) => el('th', { text: h })))]),
    el('tbody', {}, order.map((k) => {
      const t = by[k], ms = mean(t.scores), mt = mean(t.time);
      return el('tr', {}, [cell(TOPICS[k] || k), cell(t.students.size, 'num'), cell(t.sessions, 'num'), cell(t.scores.length, 'num'),
        cell(ms === null ? null : Math.round(ms), 'num'), cell(mt === null ? null : mmss(mt), 'num')]);
    }))
  ])]);
}

/* ───── "What the numbers mean" ───── */
const EXPLAIN = [
  ['علامة الكويز', 'المتغير التابع', 'متوسط علامة الطالب بأول محاولة بكل موضوع (من 100). الإعادات ما بتنحسب، عشان نقيس شو تعلّم قبل ما يشوف الإجابات. كل محاولة بينعاد حساب علامتها من إجاباته، والمحاولات اللي ما بتتطابق بتنحذف.'],
  ['GA4 وقت، GA4 صفحات، GA4 جلسات، GA4 نزول', 'المتغيرات المستقلة (RQ1، RQ2)', 'هاي أرقام Google Analytics الجاهزة اللي أي موقع بيشوفها: engagement time، page views، sessions، وكم مرة نزل لـ 90% من الصفحة. السؤال الأساسي: هل بتعكس التعلّم؟'],
  ['GA4 مكتمل، GA4 labs، GA4 كود، GA4 مصادر', 'أحداث التعلّم (RQ3)', 'أحداث أضفناها للموقع عشان تقيس سلوك تعليمي محدد: علّم موضوع مكتمل، خلّص lab، فتح ملف كود، فتح مصدر. السؤال: هل بتفسّر العلامة أكثر من أرقام GA4 العادية؟'],
  ['وقت نشط', 'للمقارنة مع GA4 (RQ4)', 'الموقع نفسه بيحسب وقت الطالب وهو فعلاً بيتحرك أو بيكتب، وبيوقف بعد دقيقة بدون حركة. بنقارنه مع "GA4 وقت" عشان نعرف قديش رقم GA4 دقيق.'],
  ['الجهاز', 'متغير ضابط', 'desktop أو mobile أو tablet. بندخله بالتحليل عشان ما يخرّب العلاقة بين الوقت والعلامة.'],
  ['جاهزين للتحليل', 'حجم العينة الفعلي', 'طالب عنده علامة كويز وبيانات GA4 مع بعض. هاد الرقم هو اللي بيحدد قديش التحليل قوي، وهدفنا يوصل 60 على الأقل.'],
  ['الرسمة: GA4 وقت مقابل العلامة', 'كيف تقرأها', 'كل نقطة طالب. إذا النقاط بتطلع لفوق كل ما رحنا يمين، في علاقة موجبة: اللي بيقضي وقت أكثر بيجيب علامة أعلى. إذا مبعثرة، الوقت ما بيحكي كثير عن التعلّم. هاي نظرة أولية بس، والاختبار الحقيقي بـ SPSS.'],
  ['السطر الملوّن', 'بجدول الطلاب', 'طالب ما إله بيانات GA4 أو ما عمل كويز. بيضل بالجداول، بس ما بيدخل بالتحليل الأساسي.']
];

/** Tiny markdown for NOTES.md: "# " headings, "- " bullets, blank line = new paragraph. */
function notesView(text) {
  if (!text || !text.trim()) return el('p', { class: 'muted', text: 'ما في ملاحظات لسا. يوسف بيكتبها بملف NOTES.md جوا مجلد Gathering data، وبتظهر هون مع التصدير الجاي.' });
  const out = [];
  let list = null, para = [];
  const flush = () => { if (para.length) { out.push(el('p', { text: para.join(' ') })); para = []; } list = null; };
  text.split('\n').forEach((line) => {
    const l = line.trim();
    if (!l) return flush();
    if (l.startsWith('#')) { flush(); out.push(el('h4', { text: l.replace(/^#+\s*/, '') })); }
    else if (/^[-*]\s/.test(l)) { if (para.length) flush(); if (!list) { list = el('ul'); out.push(list); } list.append(el('li', { text: l.slice(2) })); }
    else { list = null; para.push(l); }
  });
  flush();
  return el('div', { class: 'notes' }, out);
}

/* ───── Rendering ───── */
function render() {
  const data = EXPORTS[state.day];
  const bounds = periodBounds();
  const all = { sessions: parseCSV(data.sessions), attempts: parseCSV(data.attempts), participants: parseCSV(data.participants) };
  const S = { head: all.sessions.head, rows: all.sessions.rows.filter((r) => inPeriod(bounds, r[all.sessions.head.indexOf('session_started_at')])) };
  const A = { head: all.attempts.head, rows: all.attempts.rows.filter((r) => inPeriod(bounds, r[all.attempts.head.indexOf('submitted_at')])) };
  const P = aggregate(S, all.participants, !!bounds);
  const t = { students: P, sessions: S, attempts: A };
  const col = (name) => P.head.indexOf(name);
  const count = (fn) => P.rows.filter(fn).length;
  const st = { n: P.rows.length, filtered: !!bounds };
  st.fetched = col('ga4_linked') !== -1 && P.rows.some((r) => r[col('ga4_linked')] !== '');
  st.withQuiz = count((r) => Number(r[col('quizzes_first_attempt')]) > 0);
  st.withGa4 = st.fetched ? count((r) => r[col('ga4_linked')] === '1') : null;
  st.both = st.fetched ? count((r) => Number(r[col('quizzes_first_attempt')]) > 0 && r[col('ga4_linked')] === '1') : null;
  st.meanScore = mean(P.rows.filter((r) => r[col('quiz_first_score_mean')] !== '').map((r) => Number(r[col('quiz_first_score_mean')])));
  const of = (k) => (st.n ? k + ' من ' + st.n : '0');
  const dates = all.sessions.rows.map((r) => r[all.sessions.head.indexOf('session_started_at')]).filter(Boolean).sort();
  $('foot').replaceChildren(
    el('div', { text: 'آخر تصدير: ' + state.day }),
    el('div', { text: dates.length ? 'البيانات من ' + localDate(dates[0]).split(',')[0] + ' إلى ' + localDate(dates[dates.length - 1]).split(',')[0] : '' }),
    el('div', { text: 'الفترة المعروضة: ' + periodLabel() }));

  const sections = [
    el('section', { id: 'overview' }, [
      el('h2', { text: 'نظرة عامة', }, [el('small', { text: periodLabel() })]),
      el('div', { class: 'cards' }, [
        card('طالب مشارك', st.n, 'فتحوا صفحة موضوع'),
        card('عملوا كويز', of(st.withQuiz), 'أول محاولة، متحققة'),
        card('إلهم بيانات بالـ GA4', st.fetched ? of(st.withGa4) : '—', st.filtered ? 'كل الفترة بس' : st.fetched ? 'الكود وصل للـ GA4' : 'GA4 ما انقرأ'),
        card('جاهزين للتحليل', st.fetched ? of(st.both) : '—', 'كويز + GA4 مع بعض'),
        card('متوسط علامة الكويز', st.meanScore === null ? '—' : Math.round(st.meanScore), 'من 100'),
        card('جلسة دراسة', S.rows.length, A.rows.length + ' محاولة كويز')
      ]),
      el('div', { class: 'panel' }, [el('p', { class: 'summary', text: summaryText(S, st) })]),
      el('div', { class: 'grid2', style: 'margin-top:12px' }, [
        el('div', { class: 'panel chart' }, [el('h3', { text: 'علامة الكويز لكل طالب (أول محاولة)' }), barChart(P)]),
        el('div', { class: 'panel chart' }, [el('h3', { text: 'وقت الـ GA4 مقابل علامة الكويز (نظرة أولية على RQ1)' }), scatter(P)])
      ])
    ]),
    el('section', { id: 'topics' }, [el('h2', { text: 'حسب الموضوع' }), topicTable(S)]),
    tableSection('students', 'الطلاب', 'سطر لكل طالب' + (st.filtered ? '، محسوب من جلسات الفترة المختارة (بدون GA4)' : '') + '.', t.students, true),
    tableSection('sessions', 'الجلسات', 'سطر لكل جلسة دراسة على صفحة موضوع.', t.sessions),
    tableSection('attempts', 'محاولات الكويز', 'سطر لكل محاولة، مع الإعادات.', t.attempts),
    el('section', { id: 'explain' }, [el('h2', { text: 'شو معنى الأرقام' }), el('div', { class: 'explain' }, EXPLAIN.map(([k, tag, text]) =>
      el('div', { class: 'panel' }, [el('h3', {}, [k, el('span', { class: 'tag', text: tag })]), el('p', { text })])))]),
    el('section', { id: 'notes' }, [el('h2', { text: 'ملاحظات يوسف' }), el('div', { class: 'panel' }, [notesView(data.notes)])]),
    el('details', {}, [el('summary', { class: 'muted', text: 'ملخص التصدير (summary.txt)' }), el('pre', { dir: 'ltr', text: data.summary || '—' })])
  ];
  if (savedPass()) sections.push(el('p', { class: 'muted note' }, [el('a', { href: '#', text: 'نسيان كلمة السر على هاد الجهاز', onclick: (e) => { e.preventDefault(); localStorage.removeItem(PASS_KEY); sessionStorage.removeItem(PASS_KEY); history.replaceState(null, '', location.pathname); location.reload(); } })]));
  $('main').replaceChildren(...sections);
}

function tableSection(key, title, sub, data, flagRows) {
  const ts = state.t[key];
  const view = el('select', {}, VIEWS.map(([v, label]) => el('option', { value: v, text: label })));
  view.value = state.view;
  view.onchange = () => { state.view = view.value; Object.values(state.t).forEach((x) => { x.sort = null; }); render(); };
  const search = el('input', { type: 'search', placeholder: 'بحث…', value: ts.q || '' });
  const box = el('div', { class: 'wrap' });
  const draw = () => box.replaceChildren(table(key, data, flagRows, draw));
  search.oninput = () => { ts.q = search.value; draw(); };
  draw();
  return el('section', { id: key }, [
    el('h2', { text: title }, [el('small', { text: data.rows.length + ' سطر · ' + sub })]),
    el('div', { class: 'toolbar' }, [el('label', { class: 'ctl' }, ['العرض ', view]), search]),
    box,
    el('p', { class: 'muted note' }, flagRows
      ? [el('span', { class: 'swatch' }), ' سطر ملوّن = ما إله بيانات GA4 أو ما عمل كويز. اضغط على اسم العمود للترتيب. (—) يعني ما في قيمة.']
      : ['اضغط على اسم العمود للترتيب. (—) يعني ما في قيمة.'])
  ]);
}

function table(key, { head, rows }, flagRows, redraw) {
  const ts = state.t[key], raw = state.view === 'raw';
  const spec = raw ? head.map((h) => [h, h, 'raw', '']) : COLS[key].filter((c) => head.includes(c[0]) && (state.view === 'all' || c[4]));
  const idx = spec.map((c) => head.indexOf(c[0]));
  const q = (ts.q || '').trim().toLowerCase();
  let list = q ? rows.filter((r) => r.some((v) => v.toLowerCase().includes(q)) || idx.some((i, k) => show(r[i], spec[k][2])[0].toLowerCase().includes(q))) : rows.slice();
  if (ts.sort !== null && ts.sort !== undefined) {
    const i = idx[ts.sort];
    list.sort((a, b) => {
      if (a[i] === '' || b[i] === '') return (a[i] === '') - (b[i] === ''); // missing last
      return (isNum(a[i]) && isNum(b[i]) ? a[i] - b[i] : a[i].localeCompare(b[i])) * ts.dir;
    });
  }
  const linked = head.indexOf('ga4_linked'), quiz = head.indexOf('quizzes_first_attempt');
  const thead = el('tr', {}, spec.map(([, label, , hint], k) => {
    const th = el('th', { class: 'sortable', text: label + (ts.sort === k ? (ts.dir > 0 ? ' ▲' : ' ▼') : '') });
    if (hint) th.title = hint;
    th.onclick = () => { ts.dir = ts.sort === k ? -ts.dir : 1; ts.sort = k; redraw(); };
    return th;
  }));
  const body = list.map((r) => {
    const flag = flagRows && ((linked !== -1 && r[linked] === '0') || r[quiz] === '0');
    return el('tr', flag ? { class: 'flag' } : {}, idx.map((i, k) => {
      const [text, cls, title] = raw ? [r[i] === '' ? '—' : r[i], r[i] === '' ? 'missing' : isNum(r[i]) ? 'num' : '', ''] : show(r[i], spec[k][2]);
      return el('td', Object.assign({ text }, cls ? { class: cls } : {}, title ? { title } : {}));
    }));
  });
  if (!body.length) body.push(el('tr', {}, [el('td', { colspan: String(spec.length), class: 'missing', text: rows.length ? 'ما في نتائج للبحث' : 'ما في بيانات بهاي الفترة' })]));
  return el('table', {}, [el('thead', {}, [thead]), el('tbody', {}, body)]);
}

/* ───── Controls ───── */
const loaded = () => state.day && window.EXPORTS && EXPORTS[state.day] && !EXPORTS[state.day].enc;
$('period').onchange = () => { state.period = $('period').value; $('range').hidden = state.period !== 'custom'; if (loaded()) render(); };
$('from').onchange = () => { state.from = $('from').value; if (loaded()) render(); };
$('to').onchange = () => { state.to = $('to').value; if (loaded()) render(); };
document.querySelectorAll('#nav a').forEach((a) => { a.onclick = () => document.querySelectorAll('#nav a').forEach((x) => x.classList.toggle('active', x === a)); });

/* Start: list of exports from exports/index.js, newest first. */
const days = window.EXPORT_DAYS || [];
if (!days.length) {
  message('ما في تصدير لسا. اعمل دبل كليك على Export data.command، وبعدين افتح هاي الصفحة مرة ثانية.');
  $('day').disabled = true;
} else {
  $('day').replaceChildren(...days.map((d) => el('option', { value: d, text: d })));
  $('day').onchange = () => loadDay($('day').value);
  loadDay(days[0]);
}
</script>
